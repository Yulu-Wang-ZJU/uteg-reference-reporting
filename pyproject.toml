[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "uteg-reference-reporting"
version = "2026.10.30"
description = "Source-derived U-TEG to TEG reference-reporting utilities and provenance snapshots"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.9,<2",
]

[project.optional-dependencies]
# The exact historical runners import these libraries.  Installing this extra
# does not provide private inputs or trained objects and does not run a fit.
historical = [
  "joblib>=1.1,<2",
  "scikit-learn>=1.1,<2",
  "pandas>=1.5,<3",
  "torch>=2.0,<3",
  "matplotlib>=3.6,<4",
]
# Plot conversion is optional because the code-only smoke path does not render
# figures.  The workstation-specific DLL path is resolved through the
# UTEG_CAIROSVG_DLL_ROOT/CONDA_PREFIX environment variables.
figures = [
  "matplotlib>=3.6,<4",
  "cairosvg>=2.7,<3",
  "lxml>=4.9,<6",
  "pillow>=9,<12",
  "PyMuPDF>=1.22,<2",
]
all = [
  "joblib>=1.1,<2",
  "scikit-learn>=1.1,<2",
  "pandas>=1.5,<3",
  "torch>=2.0,<3",
  "matplotlib>=3.6,<4",
  "cairosvg>=2.7,<3",
  "lxml>=4.9,<6",
  "pillow>=9,<12",
  "PyMuPDF>=1.22,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
